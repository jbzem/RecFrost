<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>RecFrost — play like it&apos;s 2023</title>
		<meta
			name="description"
			content="RecFrost is a free, open source fan rebuild of the 2023 RecNet servers. Download for PC, join the Discord, and play like it's 2023."
		/>
		<meta name="theme-color" content="#0b1526" />
		<!-- Open Graph / Twitter card: this is what link embeds (Discord, etc.) read.
		    Kept in sync with the title/description above by hand — there is no
		    build-time injection here, so a rebrand has to touch both. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="RecFrost" />
		<meta property="og:title" content="RecFrost — play like it's 2023" />
		<meta
			property="og:description"
			content="RecFrost is a free, open source fan rebuild of the 2023 RecNet servers. Download for PC, join the Discord, and play like it's 2023."
		/>
		<meta property="og:url" content="https://www.bypassedpic.workers.dev/" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="RecFrost — play like it's 2023" />
		<meta
			name="twitter:description"
			content="RecFrost is a free, open source fan rebuild of the 2023 RecNet servers. Download for PC, join the Discord, and play like it's 2023."
		/>
		<!-- Inline so the mark costs no request: a frost-blue snowflake for RecFrost. -->
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1526'/%3E%3Cg stroke='%237cc7ff' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M16 6v20'/%3E%3Cpath d='M7.7 11l16.6 10'/%3E%3Cpath d='M24.3 11L7.7 21'/%3E%3C/g%3E%3C/svg%3E"
		/>
		<!-- Archivo sets the nameplate; IBM Plex Sans carries everything else. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/client/main.tsx"></script>
	</body>
</html>
